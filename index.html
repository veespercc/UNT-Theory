<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#12181a">
  <title>UNT Math Core | Полный реестр формул и тренажёр ЕНТ</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-layout">
    <header class="app-header">
      <div class="top-meta">
        <div class="brand"><span class="pulse-indicator"></span>UNT Math Core</div>
        <div class="progress-pill">Изучено <span id="prog-val" class="prog-number">0/0</span></div>
      </div>
      <h1 class="page-title">Математика ЕНТ</h1>
      <p class="page-subtitle">Полная теоретическая база, формулы профильного уровня и адаптивный тренажёр с пошаговыми решениями.</p>
      <div class="progress-track" aria-hidden="true"><div id="prog-bar-fill" class="progress-fill"></div></div>
    </header>

    <nav class="sticky-dock">
      <div class="search-row">
        <div class="search-input-wrap">
          <svg class="search-icon" width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.1" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
          </svg>
          <input type="text" id="search" class="search-input" placeholder="Поиск: Виет, Бернулли, рационализация, конус…" autocomplete="off">
          <button id="clear-search" class="clear-btn" aria-label="Очистить поиск">&times;</button>
        </div>
        <div class="status-toggle">
          <button class="status-btn active" data-status="all">Все</button>
          <button class="status-btn" data-status="unlearned">В процессе</button>
          <button class="status-btn" data-status="mastered">Изучено</button>
        </div>
      </div>

      <div class="categories-bar" id="cat-bar">
        <button class="cat-pill active" data-cat="all">Все темы</button>
        <button class="cat-pill" data-cat="algebra">Алгебра</button>
        <button class="cat-pill" data-cat="progressions">Прогрессии</button>
        <button class="cat-pill" data-cat="trig">Тригонометрия</button>
        <button class="cat-pill" data-cat="log">Логарифмы</button>
        <button class="cat-pill" data-cat="calculus">Производная и интеграл</button>
        <button class="cat-pill" data-cat="planimetry">Планиметрия</button>
        <button class="cat-pill" data-cat="stereometry">Стереометрия</button>
        <button class="cat-pill" data-cat="vectors">Векторы</button>
        <button class="cat-pill" data-cat="probability">Вероятность</button>
      </div>
    </nav>

    <main class="cards-grid" id="cards-container"></main>
  </div>

  <button id="btnTop" class="btn-scroll-top" aria-label="Наверх">
    <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" d="M5 15l7-7 7 7"/>
    </svg>
  </button>

  <div id="toast">Скопировано</div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
