<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>UNT Math Core Engine</title>

  <!-- Google Fonts (Inter Only - Clean Sans-Serif) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- KaTeX for Math Rendering -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js" onload="initMath()"></script>

  <!-- Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <!-- Header -->
    <header class="app-header">
      <div class="top-row">
        <div class="brand">
          <span class="status-dot"></span>
          <span>UNT Core Engine</span>
        </div>
        <div class="progress-pill">
          Изучено <strong id="prog-val">0/0</strong>
        </div>
      </div>
      <h1 class="page-title">Профильная Математика</h1>
      <p class="page-desc">Инженерный справочник понятий, алгоритмов, формул и ловушек ЕНТ.</p>
    </header>

    <!-- Navigation & Control Dock -->
    <nav class="sticky-nav">
      <!-- Mode Switcher: Теория / Формулы -->
      <div class="mode-toggle-wrap">
        <div class="mode-toggle">
          <button id="mode-theory-btn" class="mode-btn" onclick="setMode('theory')">
            <svg width="15" height="15" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path>
            </svg>
            <span>Краткая теория</span>
          </button>
          <button id="mode-formulas-btn" class="mode-btn active" onclick="setMode('formulas')">
            <svg width="15" height="15" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path>
            </svg>
            <span>Формулы & Практика</span>
          </button>
        </div>
      </div>

      <!-- Search Input -->
      <div class="search-wrap">
        <svg class="search-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
        </svg>
        <input type="text" id="search" class="search-input" placeholder="Поиск (Виет, производная, логарифм, трапеция)...">
      </div>

      <!-- Categories Filter -->
      <div class="categories-bar" id="cat-bar">
        <button class="cat-pill active" data-cat="all">Все темы</button>
        <button class="cat-pill" data-cat="algebra">Алгебра 7–9</button>
        <button class="cat-pill" data-cat="progressions">Прогрессии</button>
        <button class="cat-pill" data-cat="trig">Тригонометрия</button>
        <button class="cat-pill" data-cat="log">Логарифмы & Степени</button>
        <button class="cat-pill" data-cat="calculus">Анализ & Производные</button>
        <button class="cat-pill" data-cat="planimetry">Планиметрия (2D)</button>
        <button class="cat-pill" data-cat="stereometry">Стереометрия & Векторы</button>
        <button class="cat-pill" data-cat="probability">Вероятность & Комбинаторика</button>
      </div>
    </nav>

    <!-- Cards List View -->
    <main class="cards-list" id="cards-container"></main>
  </div>

  <!-- Floating Scroll To Top -->
  <button id="btnTop" class="btn-top" aria-label="Вверх">
    <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 15l7-7 7 7"></path>
    </svg>
  </button>

  <!-- Toast -->
  <div id="toast">Скопировано в буфер</div>

  <!-- Custom Scripts -->
  <script src="app.js"></script>
</body>
</html>
